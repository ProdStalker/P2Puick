[workspace]
resolver = "2"
members = [
    "crates/p2puick-core",
    "crates/p2puick-discovery",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ProdStalker"]

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
bytes = "1"
dirs = "6"
mdns-sd = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
walkdir = "2"
p2puick-core = { path = "crates/p2puick-core" }
p2puick-discovery = { path = "crates/p2puick-discovery" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
