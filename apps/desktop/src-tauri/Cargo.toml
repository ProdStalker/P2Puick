[package]
name = "p2puick"
version = "0.1.3"
description = "P2Puick — LAN P2P file transfer"
authors = ["ProdStalker"]
edition = "2021"

[lib]
name = "p2puick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
p2puick-core = { path = "../../../crates/p2puick-core" }
p2puick-discovery = { path = "../../../crates/p2puick-discovery" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
anyhow = "1"
thiserror = "2"
